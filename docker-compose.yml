name: zubie-iran

# Production-shaped stack. Copy .env.example to .env and fill the REQUIRED values first.
# TLS is expected at a reverse proxy in front of this stack (see README); ports bind to loopback only.

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  networks: [zubie]

services:
  db:
    <<: *hardening
    image: postgres:16-alpine
    container_name: zubie-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zubie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (no default on purpose)}
      POSTGRES_DB: ${POSTGRES_DB:-zubie}
    volumes:
      - zubie-db-data:/var/lib/postgresql/data
    # No published port: only the backend reaches the database, over the private network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zubie} -d ${POSTGRES_DB:-zubie}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    pids_limit: 200

  backend:
    <<: *hardening
    build:
      context: ./backend
    container_name: zubie-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ZUBIE_ENVIRONMENT: production
      ZUBIE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zubie}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zubie}
      ZUBIE_SECRET_KEY: ${ZUBIE_SECRET_KEY:?Set ZUBIE_SECRET_KEY in .env (python -c "import secrets; print(secrets.token_urlsafe(48))")}
      ZUBIE_CORS_ORIGINS: ${ZUBIE_CORS_ORIGINS:?Set ZUBIE_CORS_ORIGINS in .env to the dashboard origin}
      ZUBIE_TELEMETRY_INTERVAL: ${ZUBIE_TELEMETRY_INTERVAL:-2}
      # Off unless you deliberately want the public demo accounts (demo@zubie.ir) in this deployment.
      ZUBIE_SEED_DEMO: ${ZUBIE_SEED_DEMO:-false}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8010}:8000"
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    pids_limit: 200

  frontend:
    <<: *hardening
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8010}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8010}
    container_name: zubie-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3010}:3010"
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    mem_limit: 512m
    pids_limit: 200

volumes:
  zubie-db-data:

networks:
  zubie:
    driver: bridge
