name: CI and security gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly: new advisories land even when the code does not change

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests, SAST and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-cov httpx bandit pip-audit ruff mypy
      - name: Lint and types
        run: |
          ruff check app tests scripts
          mypy app
      - name: Tests (tenancy, roles, websocket, rate limits, read paths) with a coverage floor
        run: python -m pytest -q --cov=app --cov-fail-under=80
      - name: Bandit (SAST)
        run: bandit -r app -q -ll
      - name: pip-audit (known vulnerable dependencies)
        run: pip-audit -r requirements.txt --progress-spinner off

  frontend:
    name: Frontend typecheck, build and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: npm audit (production dependencies, high)
        # The PostCSS copy bundled by Next.js is pinned to a patched release through `overrides` in package.json.
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/python --config p/fastapi --config p/typescript --config p/react --config p/nextjs --config p/secrets --severity ERROR --error --metrics off backend/app frontend/src

  containers:
    name: Container build, hardening lint and image scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error
      - name: Build images
        run: |
          docker build -t zubie-api:${{ github.sha }} backend
          docker build -t zubie-web:${{ github.sha }} frontend
      - name: Trivy scan, API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zubie-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan, web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zubie-web:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zubie-api:${{ github.sha }}
          format: cyclonedx
          output: sbom-api.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-api.json
