[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "S"]
ignore = [
    "S101",  # asserts are the point of tests and of the __main__ self-checks
    "B008",  # FastAPI's Depends() in defaults is the framework's idiom
    "S311",  # random is used for simulation and seed data only
    "E501",  # the formatter owns line length
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]            # throwaway credentials in fixtures
"scripts/*" = ["S105", "S106", "S113"]  # the pentest probe carries known-bad secrets on purpose

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
